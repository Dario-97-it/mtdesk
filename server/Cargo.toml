[package]
name = "hbbs"
version = "1.1.17"
authors = ["Marketing Tools <marketing_tools@libero.it>"]
edition = "2021"
build = "build.rs"
default-run = "hbbs"

[[bin]]
name = "hbbr"
path = "src/hbbr.rs"

[[bin]]
# MTDesk: rinominato da rustdesk-utils. E' lo strumento a riga di comando
# per generare/validare le chiavi e per diagnosticare la connessione.
name = "mtdesk-utils"
path = "src/utils.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hbb_common = { path = "libs/hbb_common" }
serde_derive = "1.0"
serde = "1.0"
serde_json = "1.0"
lazy_static = "1.4"
clap = "2"
rust-ini = "0.18"
minreq = { version = "2.4", features = ["punycode"] }
machine-uid = "0.2"
mac_address = "1.1.5"
whoami = "1.2"
base64 = "0.13"
axum = { version = "0.5", features = ["headers"] }
sqlx = { version = "0.6", features = [ "runtime-tokio-rustls", "sqlite", "macros", "chrono", "json" ] }
deadpool = "0.8"
async-trait = "0.1"
async-speed-limit = { git = "https://github.com/open-trade/async-speed-limit" }
uuid = { version = "1.0", features = ["v4"] }
bcrypt = "0.13"
chrono = "0.4"
jsonwebtoken = "8"
headers = "0.3"
once_cell = "1.8"
sodiumoxide = "0.2"
tokio-tungstenite = "0.17"
tungstenite = "0.17"
regex = "1.4"
tower-http = { version = "0.3", features = ["fs", "trace", "cors"] }
http = "0.2"
flexi_logger = { version = "0.22", features = ["async", "use_chrono_for_offset", "dont_minimize_extra_stacks"] }
ipnetwork = "0.20"
local-ip-address = "0.5.1"
dns-lookup = "1.0.8"
ping = "0.4.0"
flate2 = "1.0"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# https://github.com/rustdesk/rustdesk-server-pro/issues/189, using native-tls for better tls support
reqwest = { git = "https://github.com/rustdesk-org/reqwest", features = ["blocking", "socks", "json", "native-tls", "gzip"], default-features=false }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
reqwest = { git = "https://github.com/rustdesk-org/reqwest", features = ["blocking", "socks", "json", "rustls-tls", "rustls-tls-native-roots", "gzip"], default-features=false }

[build-dependencies]
hbb_common = { path = "libs/hbb_common" }

[workspace]
members = ["libs/hbb_common"]
exclude = ["ui", "third_party"]

#https://github.com/johnthagen/min-sized-rust
#https://doc.rust-lang.org/cargo/reference/profiles.html#default-profiles
[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true
#opt-level = 'z' # only have smaller size after strip # Default is 3, better performance
#rpath = true # Not needed

# =====================================================================
#  MTDesk - dipendenze portate DENTRO il repository
# ---------------------------------------------------------------------
#  PERCHE'
#  Queste librerie erano dichiarate come `git = "https://github.com/..."`:
#  ogni compilazione le scaricava da repository di altri, in gran parte
#  sotto l'organizzazione rustdesk-org. Significava due cose sgradite:
#  dipendere dal fatto che quei repository restino online, e non avere
#  alcun controllo su cosa contengono.
#
#  Adesso stanno in third_party/, clonate AL COMMIT ESATTO che Cargo.lock
#  gia' fissava: il codice compilato e' identico a prima, byte per byte,
#  ma la build non contatta piu' nessuno.
#
#  COME AGGIORNARNE UNA
#  Serve solo se c'e' una ragione precisa (una correzione di sicurezza).
#  Si rifa' il clone della singola cartella al nuovo commit e si aggiorna
#  Cargo.lock. Non esiste piu' un `cargo update` che lo faccia da solo,
#  ed e' voluto: nessuno deve poter cambiare il nostro codice da fuori.
#
#  NOTA SULLE LICENZE
#  Ogni cartella conserva il proprio file di licenza. Sono licenze
#  permissive (MIT/Apache-2.0) o AGPL come il resto del progetto.
# =====================================================================

[patch."https://github.com/open-trade/async-speed-limit"]
async-speed-limit = { path = "third_party/async-speed-limit" }

[patch."https://github.com/rustdesk-org/confy"]
confy = { path = "third_party/confy" }

[patch."https://github.com/rustdesk-org/default_net"]
default_net = { path = "third_party/default_net" }

[patch."https://github.com/rustdesk-org/machine-uid"]
machine-uid = { path = "third_party/machine-uid" }

[patch."https://github.com/rustdesk-org/reqwest"]
reqwest = { path = "third_party/reqwest" }

[patch."https://github.com/rustdesk-org/sysinfo"]
sysinfo = { path = "third_party/sysinfo" }

[patch."https://github.com/rustdesk-org/tokio-socks"]
tokio-socks = { path = "third_party/tokio-socks" }
