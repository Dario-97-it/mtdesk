<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="mtBrand" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ECC71"/>
      <stop offset="0.28" stop-color="#00BCD4"/>
      <stop offset="0.55" stop-color="#2196F3"/>
      <stop offset="0.78" stop-color="#9C27B0"/>
      <stop offset="1" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="mtGlass" x1="0" y1="0" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161628"/>
      <stop offset="1" stop-color="#08081A"/>
    </linearGradient>
  </defs>
  <!-- sfondo dark glass arrotondato -->
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#mtGlass)"/>
  <rect x="2.5" y="2.5" width="91" height="91" rx="21.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
  <!-- schermo posteriore (gradiente brand) = host remoto -->
  <rect x="20" y="24" width="42" height="30" rx="6" fill="url(#mtBrand)"/>
  <rect x="36" y="54" width="10" height="6" fill="url(#mtBrand)"/>
  <rect x="28" y="60" width="26" height="4" rx="2" fill="url(#mtBrand)"/>
  <!-- schermo anteriore (bianco) = tu che controlli, sovrapposto -->
  <rect x="40" y="40" width="40" height="29" rx="6" fill="#0F0F1E"/>
  <rect x="43" y="43" width="34" height="23" rx="3.5" fill="#FFFFFF"/>
  <!-- cursore di controllo -->
  <path d="M56 50 L67 55 L61.5 56.5 L60 62 Z" fill="#00BCD4"/>
</svg>
